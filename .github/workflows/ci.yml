name: Build and NativeAOT

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    test:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Set up .NET
              uses: actions/setup-dotnet@v6
              with:
                  dotnet-version: |
                      8.0.x
                      9.0.x
                      10.0.x
                      11.0.x

            - name: Build
              run: dotnet build Banned.Qbittorrent.sln --configuration Release

            - name: Test
              run: dotnet test Banned.Qbittorrent.sln --configuration Release --no-build

            - name: Publish NativeAOT smoke application
              run: |
                  for framework in net8.0 net9.0 net10.0 net11.0; do
                      dotnet publish Banned.Qbittorrent.AotSmoke/Banned.Qbittorrent.AotSmoke.csproj --configuration Release --framework "$framework" --runtime linux-x64 --output "artifacts/aot/$framework"
                  done

            - name: Run NativeAOT smoke application
              run: |
                  for framework in net8.0 net9.0 net10.0 net11.0; do
                      "./artifacts/aot/$framework/Banned.Qbittorrent.AotSmoke"
                  done

name: Build and NativeAOT

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    test:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Set up .NET
              uses: actions/setup-dotnet@v5
              with:
                  dotnet-version: "10.0.x"

            - name: Build
              run: dotnet build Banned.Qbittorrent.sln --configuration Release

            - name: Publish NativeAOT smoke application
              run: dotnet publish Banned.Qbittorrent.AotSmoke/Banned.Qbittorrent.AotSmoke.csproj --configuration Release --runtime linux-x64 --output artifacts/aot

            - name: Run NativeAOT smoke application
              run: ./artifacts/aot/Banned.Qbittorrent.AotSmoke
